[project]
name = "troubadour"
version = "0.1.0"
description = "Live, speaker-labeled transcription of an in-person D&D table, all local"
readme = "README.md"
authors = [
    { name = "Michael Margolis", email = "acct@yipe.org" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "pyannote-audio>=4.0.7",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
troubadour = "troubadour:main"
troubadour-sim = "troubadour.sim:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]
# Benchmark scripts in spike/ only: `uv run --group spike spike/eval.py ...`
spike = [
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "pyannote-metrics>=4.1",
    "whisper-normalizer>=0.1.15",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]
ignore = [
    "E501",  # the formatter owns line length
    "SIM108",  # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
# Research scripts: kept as they were when the benchmark numbers were produced.
"spike/*" = ["B905", "B023", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Third-party noise, not ours:
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning:torchaudio",
    "ignore::UserWarning:torchaudio",
    "ignore::FutureWarning",
]
