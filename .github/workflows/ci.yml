name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Apple Silicon: mlx-whisper only installs on arm64 macOS. Tests need no models or network.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn setup
      - run: yarn check
